<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <style>
        :root {
            --bg: #0a0f1e;
            --surface: rgba(255,255,255,0.055);
            --surface-hover: rgba(255,255,255,0.09);
            --border: rgba(255,255,255,0.08);
            --live: #ff3b30;
            --green: #30d158;
            --gray: #636366;
            --blue: #0a84ff;
            --text: #ffffffee;
            --text-dim: rgba(255,255,255,0.45);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: 'Readex Pro', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,100,255,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(100,0,255,0.06) 0%, transparent 60%);
            color: var(--text);
            padding-bottom: 110px;
            min-height: 100vh;
        }
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(10,15,30,0.88);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border-bottom: 0.5px solid var(--border);
            padding: 14px 15px 12px;
        }
        .brand { text-align: center; font-size: 22px; font-weight: 800; letter-spacing: 1px; margin-bottom: 11px; }
        .brand span { color: var(--blue); }
        .brand small { font-size: 10px; color: var(--text-dim); font-weight: 400; letter-spacing: 3px; display: block; margin-top: -2px; }
        .search-box {
            background: rgba(255,255,255,0.08); border: 0.5px solid var(--border);
            border-radius: 13px; padding: 9px 14px; display: flex; align-items: center; gap: 9px;
        }
        .search-box i { color: var(--text-dim); font-size: 13px; }
        .search-box input { background: none; border: none; color: var(--text); width: 100%; outline: none; font-family: inherit; font-size: 14px; }
        .search-box input::placeholder { color: var(--text-dim); }
        .filter-tabs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .filter-btn {
            background: rgba(255,255,255,0.07); border: 0.5px solid var(--border);
            border-radius: 20px; padding: 5px 14px; font-size: 11px;
            font-family: inherit; color: var(--text-dim); cursor: pointer;
            white-space: nowrap; transition: all 0.2s; font-weight: 600;
        }
        .filter-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
        .filter-btn.live-filter.active { background: var(--live); border-color: var(--live); }
        .container { padding: 175px 12px 20px; max-width: 620px; margin: 0 auto; }
        .date-group { margin-bottom: 28px; }
        .date-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding: 0 2px; }
        .date-pill { background: var(--blue); border-radius: 20px; padding: 4px 14px; font-size: 12px; font-weight: 700; white-space: nowrap; }
        .date-pill.today { background: var(--green); color: #000; }
        .date-pill.yesterday { background: var(--gray); }
        .date-pill.past { background: var(--gray); opacity: 0.7; }
        .date-line { flex: 1; height: 0.5px; background: var(--border); }
        .league-label {
            font-size: 11px; font-weight: 700; color: var(--text-dim);
            letter-spacing: 1.5px; display: flex; align-items: center; gap: 7px; margin: 16px 0 8px 2px;
        }
        .league-label::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }
        .league-label .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: pulse 1.4s infinite; }
        .match-card {
            background: var(--surface); border: 0.5px solid var(--border);
            border-radius: 16px; padding: 14px 14px 11px; margin-bottom: 9px;
            display: flex; flex-direction: column; transition: background 0.2s, transform 0.15s;
            text-decoration: none; color: inherit; position: relative; overflow: hidden;
        }
        .match-card::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 60%);
            pointer-events: none;
        }
        .match-card.is-live { border-color: rgba(255,59,48,0.45); background: rgba(255,59,48,0.07); }
        .match-card.is-ended { opacity: 0.42; filter: grayscale(50%); }
        .match-card:active { transform: scale(0.975); background: var(--surface-hover); }
        .match-top { display: flex; align-items: center; justify-content: space-between; }
        .team { flex: 1; text-align: center; }
        .team-logo-wrap { width: 44px; height: 44px; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; }
        .team img { width: 44px; height: 44px; object-fit: contain; display: block; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6)); }
        .team-badge-fallback {
            width: 44px; height: 44px; border-radius: 10px;
            background: linear-gradient(135deg,#1a2a4a,#0d1f3c);
            border: 1px solid rgba(255,255,255,0.12);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 800; color: #fff;
        }

        .match-center { width: 100px; text-align: center; flex-shrink: 0; }
        .status-badge {
            display: inline-block; font-size: 8.5px; font-weight: 800;
            letter-spacing: 0.5px; padding: 3px 9px; border-radius: 5px;
            margin-bottom: 6px; text-transform: uppercase;
        }
        .badge-live { background: var(--live); animation: pulse 1.4s infinite; }
        .badge-upcoming { background: var(--green); color: #000; }
        .badge-ended { background: var(--gray); }
        .score-box { font-size: 24px; font-weight: 800; letter-spacing: 4px; line-height: 1; }
        .score-sep { color: var(--text-dim); }
        .time-box { font-size: 17px; font-weight: 700; line-height: 1; }
        .live-min { font-size: 12px; font-weight: 700; color: var(--live); display: block; margin-top: 5px; }
        .match-meta {
            display: flex; justify-content: center; gap: 18px;
            margin-top: 10px; padding-top: 9px;
            border-top: 0.5px solid rgba(255,255,255,0.06);
            font-size: 10px; color: var(--text-dim); flex-wrap: wrap;
        }
        .match-meta span { display: flex; align-items: center; gap: 4px; }
        .match-meta i { font-size: 9px; }
        .ch-name { color: rgba(100,180,255,0.9); font-weight: 700; }
        .comm-name { color: rgba(255,255,255,0.7); font-weight: 600; }
        .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
        .empty i { font-size: 40px; display: block; margin-bottom: 14px; opacity: 0.3; }
        .update-bar { text-align: center; font-size: 10px; color: var(--text-dim); padding: 8px; margin-top: 8px; }
        .tab-bar {
            position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 420px; height: 68px;
            background: rgba(18,18,28,0.95);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 34px; border: 0.5px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 2000; box-shadow: 0 12px 40px rgba(0,0,0,0.6);

        .tab-item.active { color: var(--blue); }

//  UCL 20:00 UTC  → beIN MAX 1
//  EPL            → beIN Sports 2 HD
//  La Liga        → beIN Sports 1 HD
//  Serie A        → beIN Sports 3 HD
//  Bundesliga     → beIN Sports 4 HD
//  Ligue 1        → beIN Sports 2 HD
// ══════════════════════════════════════════════════════
const CH = {
    bein1:  {name:"beIN Sports 1 HD",  go:"ch1"},
    beinmax:{name:"beIN MAX 1",         go:"max1"},
    bein2:  {name:"beIN Sports 2 HD",  go:"ch2"},
    bein3:  {name:"beIN Sports 3 HD",  go:"ch3"},
    bein4:  {name:"beIN Sports 4 HD",  go:"ch4"},
};

function getChannel(m){
    if(m.league==='ucl'){
        const h=new Date(m.start).getUTCHours();
        return h<19 ? CH.bein1 : CH.beinmax;
    }
    if(m.league==='epl')   return CH.bein2;
    if(m.league==='liga')  return CH.bein1;
    if(m.league==='seria') return CH.bein3;
    if(m.league==='bund')  return CH.bein4;
    if(m.league==='ligue') return CH.bein2;
    return CH.bein1;
}

//  Ligue 1:     خليل البلوشي / حسن العيدروس / رؤوف خليف
// ══════════════════════════════════════════════════════

const SPECIFIC = {
    "غلطة سراي|ليفربول|2026-03-10":       "حفيظ دراجي",
    "نيوكاسل|برشلونة|2026-03-10":          "خليل البلوشي",

    "باريس سان جيرمان|تشيلسي|2026-03-11": "خليل البلوشي",
    "بودو غليمت|سبورتينغ|2026-03-11":      "سامي الجمعان",
};

const POOL = {
    ucl_e: ["حفيظ دراجي","هاني حتحوت"],
    ucl_l: ["عصام الشوالي","خليل البلوشي","يوسف سيف"],
    epl:   ["رؤوف خليف","يوسف سيف","فارس عوض","أحمد عيد"],
    liga:  ["عصام الشوالي","حفيظ دراجي","خليل البلوشي"],
    seria: ["علي محمد علي","هاني حتحوت","حسن العيدروس"],
    bund:  ["سامي الجمعان","أحمد عيد","فارس عوض"],
    ligue: ["خليل البلوشي","حسن العيدروس","رؤوف خليف"],
};

function getComm(m){
    const day=m.start.substring(0,10);
    const sp=SPECIFIC[`${m.home}|${m.away}|${day}`];
    if(sp) return sp;
    let h=0, k=m.home+m.away+m.start;
    for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))&0xffff;
    if(m.league==='ucl'){
        const hr=new Date(m.start).getUTCHours();
        const p=hr<19?POOL.ucl_e:POOL.ucl_l;
        return p[h%p.length];
    }
    const p=POOL[m.league]||POOL.epl;
    return p[h%p.length];
}

function ini(n){const w=n.trim().split(/\s+/);return w.length>=2?w[0][0]+w[w.length-1][0]:n.substring(0,2);}
function logoHTML(n){
    const s=LOGOS[n];
    if(s) return `<img src="${s}" alt="${n}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" loading="lazy"><div class="team-badge-fallback" style="display:none">${ini(n)}</div>`;
    return `<div class="team-badge-fallback">${ini(n)}</div>`;
}

const MATCH_MS=110*60*1000;
function computeStatus(m){
    const now=Date.now(), st=new Date(m.start).getTime(), en=st+MATCH_MS;
    if(m.status==="final") return {code:"ended",badge:"انتهت",cls:"badge-ended",order:2};
    if(m.status==="in_progress"){
        if(now>en) return {code:"ended",badge:"انتهت",cls:"badge-ended",order:2};
        return {code:"live",badge:"مباشر",cls:"badge-live",order:0};
    }
    if(now>=st&&now<=en) return {code:"live",badge:"مباشر",cls:"badge-live",order:0};
    if(now>en)           return {code:"ended",badge:"انتهت",cls:"badge-ended",order:2};
    return {code:"upcoming",badge:"قادمة",cls:"badge-upcoming",order:1};
}
function liveMin(iso){return Math.min(Math.max(Math.floor((Date.now()-new Date(iso).getTime())/60000),1),90);}

const AD=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const AM=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function dk(d){return`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;}
function dayLabel(d){
    const n=new Date(),y=new Date(n);y.setDate(n.getDate()-1);const tm=new Date(n);tm.setDate(n.getDate()+1);
    if(dk(d)===dk(n))  return{text:"اليوم",cls:"today"};
    if(dk(d)===dk(y))  return{text:"أمس",cls:"yesterday"};
    if(dk(d)===dk(tm)) return{text:"غداً",cls:""};
    return{text:`${AD[d.getDay()]} ${d.getDate()} ${AM[d.getMonth()]}`,cls:n>d?"past":""};
}
function fmtTime(iso){const d=new Date(iso),h=d.getHours(),m=d.getMinutes();return`${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'م':'ص'}`;}

let AF='all';
function setFilter(f,b){AF=f;document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();}

function render(){
    const en=MATCHES.map(m=>({...m,_s:computeStatus(m)}));
    let fl=en;
    if(AF==='live')     fl=en.filter(m=>m._s.code==='live');
    if(AF==='upcoming') fl=en.filter(m=>m._s.code==='upcoming');
    if(AF==='ended')    fl=en.filter(m=>m._s.code==='ended');
    if(['ucl','epl','liga','seria','bund','ligue'].includes(AF)) fl=en.filter(m=>m.league===AF);

    const lc=en.filter(m=>m._s.code==='live').length;
    const lb=document.getElementById('liveBtn');
    if(lb) lb.innerHTML=lc>0?`🔴 مباشر <span class="live-count">${lc}</span>`:`🔴 مباشر`;

    const byD={};
    fl.forEach(m=>{const d=new Date(m.start),k=dk(d);if(!byD[k])byD[k]={date:d,leagues:{}};if(!byD[k].leagues[m.league])byD[k].leagues[m.league]=[];byD[k].leagues[m.league].push(m);});
    const sD=Object.keys(byD).sort((a,b)=>byD[a].date-byD[b].date);

    let html='';
    if(!sD.length) html=`<div class="empty"><i class="fas fa-calendar-times"></i>لا توجد مباريات</div>`;

    sD.forEach(k=>{
        const{date,leagues}=byD[k];const dl=dayLabel(date);
        html+=`<div class="date-group"><div class="date-header"><div class="date-pill ${dl.cls}">${dl.text}</div><div class="date-line"></div></div>`;
        ['ucl','epl','liga','seria','bund','ligue'].forEach(lg=>{
            if(!leagues[lg]) return;
            const meta=LEAGUE_META[lg];
            const lv=leagues[lg].filter(m=>m._s.code==='live').sort((a,b)=>new Date(a.start)-new Date(b.start));
            const up=leagues[lg].filter(m=>m._s.code==='upcoming').sort((a,b)=>new Date(a.start)-new Date(b.start));
            const ed=leagues[lg].filter(m=>m._s.code==='ended').sort((a,b)=>new Date(b.start)-new Date(a.start));
            const ord=[...lv,...up,...ed];
            html+=`<div class="league-label">${meta.flag} ${meta.label}${lv.length?'<span class="live-dot"></span>':''}</div>`;
            ord.forEach((m,i)=>{
                const s=m._s,isL=s.code==='live',isE=s.code==='ended';
                const ch=getChannel(m);
                const comm=getComm(m);
                let ctr='';
                if(isL||isE){
                    ctr=`<div class="score-box">${m.sh} <span class="score-sep">-</span> ${m.sa}</div>`;
                    if(isL) ctr+=`<span class="live-min">${liveMin(m.start)}'</span>`;
                } else { ctr=`<div class="time-box">${fmtTime(m.start)}</div>`; }
                html+=`<a href="go:${ch.go}" class="match-card${isL?' is-live':isE?' is-ended':''}" style="animation-delay:${i*0.04}s" data-q="${m.home} ${m.away} ${meta.label}">
                    <div class="match-top">
                        <div class="team"><div class="team-logo-wrap">${logoHTML(m.home)}</div><div class="team-name">${m.home}</div></div>
                        <div class="match-center"><div class="status-badge ${s.cls}">${s.badge}</div>${ctr}</div>
                        <div class="team"><div class="team-logo-wrap">${logoHTML(m.away)}</div><div class="team-name">${m.away}</div></div>
                    </div>
                    <div class="match-meta">
                        <span><i class="fas fa-tv"></i> <span class="ch-name">${ch.name}</span></span>
                        <span><i class="fas fa-microphone-alt"></i> <span class="comm-name">${comm}</span></span>
                    </div>
                </a>`;
            });
        });
        html+=`</div>`;
    });

    html+=`<div class="update-bar"><i class="fas fa-circle" style="font-size:6px;color:var(--green);vertical-align:middle;margin-left:4px;"></i> آخر تحديث: ${new Date().toLocaleTimeString('ar-SA')}</div>`;
    document.getElementById('root').innerHTML=html;
    const q=document.getElementById('searchInput').value.toLowerCase().trim();
    if(q) applySearch(q);
}

function doSearch(){applySearch(document.getElementById('searchInput').value.toLowerCase().trim());}
function applySearch(q){
    if(!q){document.querySelectorAll('.match-card').forEach(c=>c.style.display='flex');document.querySelectorAll('.date-group').forEach(g=>g.style.display='');return;}
    document.querySelectorAll('.match-card').forEach(c=>c.style.display=c.getAttribute('data-q').toLowerCase().includes(q)?'flex':'none');
    document.querySelectorAll('.date-group').forEach(g=>g.style.display=[...g.querySelectorAll('.match-card')].some(c=>c.style.display!=='none')?'block':'none');
}

render();
setInterval(render,60000);
</script>
</body>
</html>
